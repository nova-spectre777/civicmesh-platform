name: verification
on: [push, pull_request]
jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S edge-cpp -B edge-cpp/build
      - run: cmake --build edge-cpp/build
      - run: ctest --test-dir edge-cpp/build --output-on-failure
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.x'}
      - run: cd gateway-go && go test ./...
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: fwilhe2/setup-kotlin@main
        with: {version: '1.9.0'}
      - run: ./scripts/test_kotlin.sh
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: cd web-ts && npm run build && npm test
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: cd simulator-python && PYTHONPATH=. python -m unittest discover -s tests -p 'test_*.py'
  interoperability:
    runs-on: ubuntu-latest
    needs: [go, typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.x'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: cd web-ts && npm run build
      - run: cd gateway-go && go run ./cmd/civicmesh-fixture > /tmp/fixture.json
      - run: node scripts/verify_fixture.mjs /tmp/fixture.json
